name: RaceDay Build and Test
on:
  push:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

   
